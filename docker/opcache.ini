; OPcache: cachea el bytecode PHP compilado en memoria.
; Acelera mucho cada petición porque PHP no recompila los .php en cada request.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; En producción el código no cambia hasta el siguiente deploy (contenedor nuevo),
; así que desactivamos la comprobación de cambios para máxima velocidad.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
